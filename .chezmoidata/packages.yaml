packages:
    darwin:
        brews:
            # Required by shell setup and provisioning hooks.
            - 'zsh'
            - 'git'
            - 'curl'
            - 'jq'
            - 'unzip'
        optional_brews:
            - 'nushell'
        casks:
            - 'betterdisplay'
            - 'ghostty'
            - 'jordanbaird-ice'
            - 'jackielii/tap/skhd-zig'
        taps:
            - 'jackielii/tap'  # skhd.zig
        arm64:
            casks:
                - 'vorssaint'
    linux:
        apt:
            packages:
                - 'zsh'
                - 'git'
                - 'curl'
                - 'jq'
                - 'build-essential'
                - 'libdigest-sha-perl'
                - 'tar'
                - 'unzip'
                - 'xz-utils'
            repositories:
        pacman:
            packages:
                - 'zsh'
                - 'git'
                - 'curl'
                - 'jq'
                - 'base-devel'
                - 'perl'
                - 'tar'
                - 'unzip'
                - 'xz'
                - 'ghostty'
            repositories:
        dnf:
            packages:
                - 'zsh'
                - 'git'
                - 'jq'
                - 'gcc'
                - 'perl-Digest-SHA'
                # Accept curl or curl-minimal without replacing either.
                - '/usr/bin/curl'
                - 'tar'
                - 'unzip'
                - 'xz'
                # Install the shell changer used by the default-shell hook.
                - '/usr/bin/chsh'
    windows:
        winget:
            - 'Starship.Starship'
            - 'fzf'
            - 'sharkdp.bat'
            - 'alacritty'
#        chocolatey: # Maybe?
